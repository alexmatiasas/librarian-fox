[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
    { id = "ruff-check", types_or = [
        "python",
        "pyi",
    ], args = [
        "--fix",
    ] },
    { id = "ruff-format", types_or = [
        "python",
        "pyi",
    ] },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.12.0"
hooks = [{ id = "uv-lock" }]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "debug-statements" },
    { id = "name-tests-test", args = [
        "--pytest-test-first",
    ] },
    { id = "check-ast" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "pyright", name = "pyright", language = "system", entry = "uv run pyright", types = [
        "python",
    ], pass_filenames = false },
]
