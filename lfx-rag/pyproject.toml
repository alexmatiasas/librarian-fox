[project]
name = "lfx-rag"
version = "0.1.0"
description = "RAG on personal library made with lfx"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lancedb>=0.36.0",
    "mlflow>=3.14.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.1",
    "typer>=0.27.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
lfx-rag = "lfx_rag.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.23.15",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
include = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
