[project]
name = "lfx-rag"
version = "0.1.0"
description = "RAG on personal library made with lfx"
requires-python = ">=3.12"
dependencies = [
  "ebooklib>=0.20",
  "fastapi[standard]>=0.161.0",
  "httpx>=0.28.1",
  "lancedb>=0.36.0",
  "mlflow>=3.14.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pymupdf>=1.25.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.32",
  "pyyaml>=6.0.3",
  "sentence-transformers>=5.6.1",
  "typer>=0.27.0",
  "uvicorn>=0.52.0",
]

[project.scripts]
lfx-rag = "lfx_rag.cli.main:app"

[dependency-groups]
dev = [
  "marimo[recommended]>=0.23.15",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "lfx_rag.api.main:app"

[tool.harlequin]
default_profile = "migration-lfx-rag"

[tool.harlequin.profiles.migration-lfx-rag]
adapter = "sqlite"
theme = "tokyo-night"
viewer_max_rows = 100000
keymap_name = ["vscode"]
conn_str = ["tests/fixtures/manifest.db"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
# marimo notebooks are linted/formatted by marimo, not ruff
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF"]

[tool.uv]
package = true
