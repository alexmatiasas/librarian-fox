pre-commit:
  parallel: true
  commands:
    golangci-lint:
      env: &lfx_env
        PATH: "/opt/homebrew/bin:/usr/local/bin:$PATH"
      run: golangci-lint run ./...
      glob: '*.go'
      stage_fixed: true
    go-fmt:
      env: *lfx_env
      glob: '*.go'
      run: gofumpt -w -extra {staged_files}
      stage_fixed: true
    go-mod-tidy:
      env: *lfx_env
      run: go mod tidy
      stage_fixed: true
    python-hooks:
      env: *lfx_env
      glob: "**/*.py"
      exclude:
        - 'lfx-rag/notebooks/**'
      run: prek run 'lfx-rag/' --files {staged_files}
    repo-hygiene:
      env: *lfx_env
      run: prek run --config prek.toml --files {staged_files}

commit-msg:
  commands:
    validate:
      run: |
        MSG=$(cat "{1}")
        if ! echo "$MSG" | grep -qE "^[A-Z][a-zA-Z0-9 ,.:;()!?¿¡']+( [a-zA-Z0-9 ,.:;()!?¿¡'-]+)*$"; then
          echo "Invalid commit message format."
          echo "Use imperative mood, start with capital letter."
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    go-test:
      env: *lfx_env
      run: go test -tags sqlite_fts5 -race -count=1 ./...
    python-test:
      env: *lfx_env
      root: "lfx-rag/"
      run: uv run pytest -v

post-checkout:
  commands:
    deps:
      env: *lfx_env
      run: go mod download

post-merge:
  commands:
    deps:
      env: *lfx_env
      run: go mod download
