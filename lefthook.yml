pre-commit:
  parallel: true
  commands:
    golangci-lint:
      run: golangci-lint run ./...
      glob: '*.go'
      stage_fixed: true
    go-fmt:
      glob: '*.go'
      run: gofumpt -w -extra {staged_files}
      stage_fixed: true
    go-mod-tidy:
      run: go mod tidy
      stage_fixed: true
    python-hooks:
      glob: "**/*.py"
      run: prek run --directory lfx-rag --config lfx-rag/prek.toml --files {staged_files}
    repo-hygiene:
      run: prek run --config prek.toml --files {staged_files}

commit-msg:
  commands:
    validate:
      run: |
        MSG=$(cat "{1}")
        if ! echo "$MSG" | grep -qE "^[A-Z][a-zA-Z0-9 ,.:;()!?¿¡']+( [a-zA-Z0-9 ,.:;()!?¿¡'-]+)*$"; then
          echo "Invalid commit message format."
          echo "Use imperative mood, start with capital letter."
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    go-test:
      run: go test -race -count=1 ./...
    python-test:
      root: "lfx-rag/"
      run: uv run pytest -v

post-checkout:
  commands:
    deps:
      run: go mod download

post-merge:
  commands:
    deps:
      run: go mod download
